name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: C++ release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          bash scripts/ci-setup.sh
          bash scripts/run-tests.sh
          bash scripts/check-generated.sh
      - name: Publish
        run: bash scripts/publish.sh
